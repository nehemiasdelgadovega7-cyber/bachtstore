<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS - BachtStore</title>
<style>
body{margin:0;font-family:system-ui;background:#f4f5f9;display:flex}
.sidebar{width:210px;background:#141423;color:white;padding:20px;min-height:100vh}
.main{flex:1;display:grid;grid-template-columns:1.2fr .8fr;gap:12px;padding:15px}
.card{background:white;padding:14px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.product{display:inline-block;width:120px;padding:10px;margin:6px;background:#fff;border:1px solid #eee;border-radius:12px;text-align:center;cursor:pointer}
.product:hover{border-color:#ff6a00}
input{padding:11px;border:1px solid #ddd;border-radius:10px;width:100%;box-sizing:border-box}
.btn{padding:12px;border:none;border-radius:10px;font-weight:700;cursor:pointer;width:100%;margin-top:6px}
.btn-orange{background:#ff6a00;color:white} .btn-black{background:#111;color:white}
</style>
</head>
<body>
<div class="sidebar">
<h3>BachtStore POS</h3>
<a href="{% url 'dashboard' %}" style="color:#aaa;text-decoration:none">← Dashboard</a><br><br>
<a href="{% url 'facturacion' %}" style="color:#aaa;text-decoration:none">Facturación</a>
</div>
<div class="main">
<div>
<div class="card"><input placeholder="🔍 Buscar producto por nombre o código de barras..."></div>
<div class="card" style="margin-top:12px">
<b>Productos rápidos</b><br><br>
<div class="product" onclick="alert('Agregado')"><b>Filtro</b><br><small>S/ 25</small></div>
<div class="product"><b>Aceite Motul</b><br><small>S/ 42</small></div>
<div class="product"><b>Pastilla</b><br><small>S/ 35</small></div>
<div class="product"><b>Cadena 520</b><br><small>S/ 120</small></div>
<div class="product"><b>Bujía</b><br><small>S/ 15</small></div>
</div>
</div>
<div>
<div class="card">
<b>Ticket de Venta</b> - <small>{{ tienda.nombre|default:request.user.username }}</small>
<hr>
<p style="color:#999;text-align:center;padding:20px">Carrito vacío</p>
<hr>
<p>Subtotal: S/ 0.00<br>IGV: S/ 0.00<br><b style="font-size:20px">Total: S/ 0.00</b></p>
<select><option>Efectivo</option><option>Yape / Plin</option><option>Tarjeta</option><option>Crédito</option></select>
<button class="btn btn-black">BOLETA</button>
<button class="btn btn-orange">FACTURA</button>
<button class="btn" style="background:#eee;color:#000">Imprimir Ticket 58mm</button>
</div>
</div>
</div>
</body>
</html>

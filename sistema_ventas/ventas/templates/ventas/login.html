{% extends 'ventas/base.html' %}{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-violet-600 to-[#0a0a0f] p-4">
  <div class="bg-white text-black rounded-[32px] p-8 w-full max-w-sm shadow-2xl">
    <div class="text-center mb-6"><div class="w-14 h-14 bg-black text-white rounded-2xl flex items-center justify-center mx-auto text-2xl">🏍️</div><h1 class="text-3xl font-black mt-3">BachtStore</h1><p class="text-gray-500">MOTO PARTS PRO</p></div>
    {% if error %}<div class="bg-red-100 text-red-600 p-3 rounded-xl mb-4 text-sm font-bold">{{ error }}</div>{% endif %}
    <form method="POST" class="space-y-4">{% csrf_token %}
      <input name="username" placeholder="Usuario" required class="w-full p-4 bg-gray-100 rounded-2xl outline-none focus:ring-2 focus:ring-violet-600">
      <input name="password" type="password" placeholder="Clave" required class="w-full p-4 bg-gray-100 rounded-2xl outline-none">
      <button class="w-full bg-black text-white p-4 rounded-2xl font-black text-lg">Entrar →</button>
    </form>
    <a href="/registro/" class="block text-center mt-4 text-violet-600 font-bold">Crear tienda nueva</a>
  </div>
</div>
{% endblock %}

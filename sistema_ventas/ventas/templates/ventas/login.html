<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar - BachtStore</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
<h2 class="text-2xl font-bold text-center mb-2">Entrar a tu tienda</h2>
<p class="text-center text-gray-500 text-sm mb-6">Bienvenido de nuevo</p>

{% if error %}
<div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 text-center">{{ error }}</div>
{% endif %}

<form method="POST">
{% csrf_token %}
<input type="text" name="username" placeholder="Usuario" required class="w-full p-3 border rounded-lg mb-4">
<input type="password" name="password" placeholder="Clave" required class="w-full p-3 border rounded-lg mb-4">
<button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700">Entrar</button>
</form>

<p class="text-center text-sm mt-6 text-gray-500">¿No tienes tienda? <a href="/registro/" class="text-blue-600 font-semibold">Crea una aquí</a></p>
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head><title>Entrar - BachtStore</title></head>
<body style="font-family: sans-serif; padding: 40px; text-align: center;">
<h2>Entrar a tu tienda</h2>
{% if error %}
<p style="color:red; background: #ffdddd; padding: 10px;">{{ error }}</p>
{% endif %}
<form method="POST">
{% csrf_token %}
<input type="text" name="username" placeholder="Usuario" required style="padding:10px; width:250px;"><br><br>
<input type="password" name="password" placeholder="Contraseña" required style="padding:10px; width:250px;"><br><br>
<button type="submit" style="padding:10px 20px; background:black; color:white; border:none;">Entrar</button>
</form>
<br>
<p>¿No tienes tienda? <a href="/registro/">Crea una aquí</a></p>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BachtStore</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Poppins',sans-serif}</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-violet-600 via-indigo-600 to-fuchsia-600 flex items-center justify-center p-4">
<div class="w-full max-w-md">
  <div class="text-center mb-6">
    <div class="inline-flex w-16 h-16 bg-white rounded-2xl items-center justify-center text-3xl shadow-xl">🛒</div>
    <h1 class="text-white text-3xl font-bold mt-4">BachtStore</h1>
    <p class="text-violet-200">Tu bodega en internet en 30 segundos</p>
  </div>
  <div class="bg-white rounded-[24px] shadow-2xl p-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-1">Crea tu Bodega</h2>
    <p class="text-gray-500 text-sm mb-6">Con RUC o sin RUC, tú eliges</p>
    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <input name="nombre_tienda" placeholder="Nombre de tu bodega - Ej: Bodega Nehemías" required class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:ring-4 focus:ring-violet-100 focus:border-violet-500 outline-none">
      <input name="ruc" placeholder="RUC (Opcional)" maxlength="11" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:ring-4 focus:ring-violet-100 focus:border-violet-500 outline-none">
      <div class="grid grid-cols-2 gap-3">
        <input name="username" placeholder="Usuario" required class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 outline-none">
        <input name="password" type="password" placeholder="Clave" required class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 outline-none">
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg">🚀 CREAR MI BODEGA GRATIS</button>
    </form>
  </div>
</div>
</body>
</html>

{% extends 'ventas/base.html' %}{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-violet-600 to-[#0a0a0f] p-4">
  <div class="bg-white text-black rounded-[32px] p-8 w-full max-w-sm shadow-2xl">
    <h1 class="text-3xl font-black text-center">Crear Tienda</h1><p class="text-center text-gray-500 mb-6">BachtStore PRO 2026</p>
    {% if error %}<div class="bg-red-100 text-red-600 p-3 rounded-xl mb-4 text-sm">{{ error }}</div>{% endif %}
    <form method="POST" class="space-y-4">{% csrf_token %}
      <input name="username" placeholder="Nombre de tu tienda (ej: motoabi)" required class="w-full p-4 bg-gray-100 rounded-2xl">
      <input name="password" type="password" placeholder="Crea una clave" required class="w-full p-4 bg-gray-100 rounded-2xl">
      <button class="w-full bg-violet-600 text-white p-4 rounded-2xl font-black">Crear y Entrar →</button>
    </form>
    <a href="/login/" class="block text-center mt-4 font-bold">Ya tengo cuenta</a>
  </div>
</div>
{% endblock %}

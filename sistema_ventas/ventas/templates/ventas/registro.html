<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BachtStore</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-gradient-to-br from-violet-600 to-fuchsia-600 flex items-center justify-center p-4">
<div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8">
<h1 class="text-3xl font-bold text-center">🛒 BachtStore</h1>
<p class="text-center text-gray-500 mb-6">Tu bodega en internet</p>
<form method="POST" class="space-y-4">
{% csrf_token %}
<input name="nombre_tienda" placeholder="Nombre de tu bodega" required class="w-full px-4 py-3 rounded-xl bg-gray-100 border">
<input name="ruc" placeholder="RUC opcional" class="w-full px-4 py-3 rounded-xl bg-gray-100 border">
<input name="username" placeholder="Usuario" required class="w-full px-4 py-3 rounded-xl bg-gray-100 border">
<input name="password" type="password" placeholder="Clave" required class="w-full px-4 py-3 rounded-xl bg-gray-100 border">
<button class="w-full bg-violet-600 text-white font-bold py-4 rounded-xl">🚀 CREAR MI BODEGA GRATIS</button>
</form>
</div>
</body>
</html>

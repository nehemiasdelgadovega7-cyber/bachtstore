<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - BachtStore</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-10">
<div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
<h2 class="text-2xl font-bold text-center mb-6">Crea tu tienda</h2>

{% if error %}
<div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 text-center">{{ error }}</div>
{% endif %}

<form method="POST">
{% csrf_token %}
<input type="text" name="username" placeholder="Usuario (ej: abimotos)" required class="w-full p-3 border rounded-lg mb-3">
<input type="text" name="nombre_tienda" placeholder="Nombre de tu tienda" required class="w-full p-3 border rounded-lg mb-3">
<input type="text" name="tipo_negocio" placeholder="Tipo de negocio" required class="w-full p-3 border rounded-lg mb-3">
<input type="text" name="ruc" placeholder="RUC (opcional)" class="w-full p-3 border rounded-lg mb-3">
<input type="text" name="direccion" placeholder="Dirección" class="w-full p-3 border rounded-lg mb-3">
<input type="password" name="password" placeholder="Crea tu clave" required class="w-full p-3 border rounded-lg mb-4">
<button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700">Crear tienda</button>
</form>

<p class="text-center text-sm mt-6 text-gray-500">¿Ya tienes tienda? <a href="/login/" class="text-blue-600 font-semibold">Entra aquí</a></p>
</div>
</body>
</html>

{% extends 'ventas/base.html' %}{% block content %}
<div class="max-w-6xl mx-auto p-8"><div class="flex justify-between items-center mb-6"><h1 class="text-4xl font-black">Productos</h1><a href="/dashboard/" class="bg-white text-black px-6 py-3 rounded-2xl font-bold">← Dashboard</a></div>
<form method="POST" class="bg-[#15151f] border border-white/10 rounded-[24px] p-6 flex gap-3 mb-6">{% csrf_token %}<input name="nombre" placeholder="Nombre producto (ej: Filtro aceite)" required class="flex-1 p-4 bg-white/5 rounded-2xl outline-none"><input name="precio_venta" type="number" step="0.01" placeholder="Precio" class="w-32 p-4 bg-white/5 rounded-2xl"><input name="stock" type="number" placeholder="Stock" class="w-24 p-4 bg-white/5 rounded-2xl"><button class="bg-violet-600 px-8 rounded-2xl font-black">Agregar</button></form>
<div class="bg-[#15151f] rounded-[24px] border border-white/10 overflow-hidden">{% for p in productos %}<div class="p-5 border-b border-white/5 flex justify-between items-center"><span class="font-bold">{{ p.nombre }}</span><span class="text-gray-400">S/ {{ p.precio_venta }} • Stock {{ p.stock }}</span></div>{% empty %}<div class="p-16 text-center text-gray-500">No hay productos. ¡Agrega el primero!</div>{% endfor %}</div></div>
{% endblock %}

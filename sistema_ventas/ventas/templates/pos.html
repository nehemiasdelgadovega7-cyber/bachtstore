<!DOCTYPE html>
<html><body style="font-family:Arial;max-width:600px;margin:20px auto;padding:20px">
<h1>{{ empresa.nombre }}</h1>
<p>Usuario: {{ request.user.username }} | <a href="/admin/logout/">Salir</a></p>
<hr>
<h3>Agregar mi producto</h3>
<form method="POST">{% csrf_token %}
<input name="nombre" placeholder="Ej: Queso fresco" required style="padding:8px">
<input name="precio" type="number" step="0.01" placeholder="Precio S/" required style="padding:8px">
<button style="padding:8px 15px;background:black;color:white">Agregar</button>
</form>
<hr>
<h2>Mis Productos ({{ productos.count }})</h2>
{% for p in productos %}
<p><b>{{ p.nombre }}</b> - S/ {{ p.precio }}</p>
{% empty %}
<p>Aun no tienes productos. Usa el formulario de arriba.</p>
{% endfor %}
</body></html>

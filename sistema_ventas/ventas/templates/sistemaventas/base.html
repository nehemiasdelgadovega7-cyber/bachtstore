<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BachtStore PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif; background:#121212; color:white;}</style>
</head>
<body class="flex">
    <!-- SIDEBAR -->
    <aside class="w-64 bg-[#1A1A1A] h-screen p-5 fixed">
        <h1 class="text-2xl font-black"><span class="bg-orange-500 p-2 rounded-lg">🛍️</span> BachtStore</h1>
        <p class="text-xs text-gray-500 mb-10">POS • SaaS</p>
        <nav class="space-y-3">
            <a href="/dashboard/" class="block bg-orange-600 p-3 rounded-xl font-bold">📊 Dashboard</a>
            <a href="/pos/" class="block hover:bg-[#2A2A2A] p-3 rounded-xl">🧾 POS</a>
            <a href="/productos/" class="block hover:bg-[#2A2A2A] p-3 rounded-xl">📦 Productos</a>
            <a href="/clientes/" class="block hover:bg-[#2A2A2A] p-3 rounded-xl">👥 Clientes</a>
        </nav>
        <div class="absolute bottom-5">
            <p class="font-bold">{{ request.user.username }}</p>
            <p class="text-xs text-gray-400">Lima, Perú</p>
        </div>
    </aside>
    <main class="ml-64 flex-1 p-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
